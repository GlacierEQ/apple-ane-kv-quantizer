name: Public Truth Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python surfaces
        run: python -m compileall -q src tests mastermind_sidecar.py
      - name: Run deterministic proof
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify public truth token
        run: |
          grep -q 'MODELED_SCENARIO_NOT_HARDWARE_MEASUREMENT' README.md
          grep -q 'not affiliated with, endorsed by, or operated by Apple' README.md
